[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.100.0"
repository = "https://github.com/usslmuk/rustydiscord"

[workspace.dependencies]
rustydiscord-builders = { path = "crates/rustydiscord-builders", version = "0.0.2" }
rustydiscord-brokers = { path = "crates/rustydiscord-brokers", version = "0.0.2" }
rustydiscord-cache = { path = "crates/rustydiscord-cache", version = "0.0.2" }
rustydiscord-collection = { path = "crates/rustydiscord-collection", version = "0.0.2" }
rustydiscord-formatters = { path = "crates/rustydiscord-formatters", version = "0.0.2" }
rustydiscord-gateway = { path = "crates/rustydiscord-gateway", version = "0.0.2", default-features = false }
rustydiscord-macros = { path = "crates/rustydiscord-macros", version = "0.0.2" }
rustydiscord-model = { path = "crates/rustydiscord-model", version = "0.0.2" }
rustydiscord-opcodes = { path = "crates/rustydiscord-opcodes", version = "0.0.2" }
rustydiscord-proxy = { path = "crates/rustydiscord-proxy", version = "0.0.2" }
rustydiscord-rest = { path = "crates/rustydiscord-rest", version = "0.0.2", default-features = false }
rustydiscord-util = { path = "crates/rustydiscord-util", version = "0.0.2" }
rustydiscord-voice = { path = "crates/rustydiscord-voice", version = "0.0.2" }

aes-gcm = { version = "0.11.1", default-features = false }
bitflags = "2.13.2"
bytes = "1.12.2"
chacha20poly1305 = { version = "0.11.0", default-features = false }
compact_str = { version = "0.10.0", default-features = false }
dashmap = { version = "6.2.1", default-features = false }
davey = "0.2.0"
ed25519-dalek = { version = "3.0.0", default-features = false }
eetf = { version = "0.12", default-features = false }
divan = "0.1.21"
fastrand = "2.5.0"
flate2 = { version = "1.1.11", default-features = false }
foldhash = { version = "0.2.0", default-features = false, features = ["std"] }
futures-core = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
indexmap = { version = "2.14.2", default-features = false, features = ["std"] }
mimalloc = { version = "0.1.52", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
openmls = "0.8.3"
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
opus2 = { version = "0.4.0", default-features = false, features = ["backend-libopus", "bundled", "static"] }
rustls = { version = "0.23.46", default-features = false }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-websockets = { version = "0.13.3", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
web-time = "1.1.0"
webpki-roots = "1.0.12"
zstd = { version = "0.14.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "allow"
bare_urls = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
lto = "thin"
debug = "line-tables-only"
