[package]
name = "rustydiscord-gateway"
description = "Discord gateway client with sharding and transport compression"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/usslmuk/rustydiscord/tree/main/crates/rustydiscord-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
metrics = []
default = ["zlib-stream"]
zstd-stream = ["dep:zstd"]
zlib-stream = ["dep:flate2"]
etf = ["dep:eetf", "dep:num-bigint", "dep:num-traits"]
native-roots = ["dep:rustls-native-certs"]

[dependencies]
rustydiscord-model.workspace = true
eetf = { workspace = true, optional = true }
fastrand.workspace = true
flate2 = { workspace = true, optional = true, features = ["zlib-rs"] }
futures-util = { workspace = true, features = ["sink", "std"] }
num-bigint = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-native-certs = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tokio-websockets = { workspace = true, features = ["client", "fastrand", "ring", "rustls-bring-your-own-connector"] }
tracing = { workspace = true, features = ["std"] }
webpki-roots.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
divan.workspace = true
eetf.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-websockets = { workspace = true, features = ["server"] }

[[bench]]
name = "gateway"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
