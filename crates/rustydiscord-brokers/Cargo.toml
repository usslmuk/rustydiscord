[package]
name = "rustydiscord-brokers"
description = "Pluggable event brokers for rustydiscord bots built on tokio broadcast channels"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/usslmuk/rustydiscord/tree/main/crates/rustydiscord-brokers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
