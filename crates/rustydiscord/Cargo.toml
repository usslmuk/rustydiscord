[package]
name = "rustydiscord"
description = "A fast framework for building Discord bots in Rust"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/usslmuk/rustydiscord/tree/main/crates/rustydiscord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["gateway", "hyper", "zlib-stream"]
hyper = ["rustydiscord-rest/hyper"]
gateway = ["dep:rustydiscord-gateway", "hyper"]
zstd-stream = ["gateway", "rustydiscord-gateway/zstd-stream"]
zlib-stream = ["gateway", "rustydiscord-gateway/zlib-stream"]
etf = ["gateway", "rustydiscord-gateway/etf"]
native-roots = ["rustydiscord-gateway?/native-roots", "rustydiscord-rest/native-roots", "rustydiscord-voice?/native-roots"]
sharding = ["gateway", "dep:serde", "dep:serde_json", "tokio/io-util", "tokio/net", "tokio/process"]
voice = ["gateway", "dep:rustydiscord-voice"]
http-interactions = ["dep:ed25519-dalek", "dep:serde_json"]

[dependencies]
rustydiscord-builders.workspace = true
rustydiscord-brokers.workspace = true
rustydiscord-cache.workspace = true
rustydiscord-collection.workspace = true
rustydiscord-macros.workspace = true
rustydiscord-formatters.workspace = true
rustydiscord-gateway = { workspace = true, optional = true }
rustydiscord-model.workspace = true
rustydiscord-opcodes.workspace = true
rustydiscord-proxy.workspace = true
rustydiscord-rest.workspace = true
rustydiscord-util.workspace = true
rustydiscord-voice = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true, features = ["fast"] }
futures-core.workspace = true
serde = { workspace = true, features = ["derive", "std"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
bytes.workspace = true
divan.workspace = true
ed25519-dalek.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-websockets = { workspace = true, features = ["server", "ring"] }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "std"] }

[[example]]
name = "advanced"
required-features = ["gateway"]

[[example]]
name = "components"
required-features = ["gateway"]

[[example]]
name = "maxbot"
required-features = ["gateway"]

[[example]]
name = "moderation"
required-features = ["gateway"]

[[example]]
name = "ping"
required-features = ["gateway"]

[[example]]
name = "slash_commands"
required-features = ["gateway"]

[[test]]
name = "http_interactions"
required-features = ["http-interactions"]

[[bench]]
name = "managers"
harness = false
required-features = ["gateway"]

[[bench]]
name = "sharding"
harness = false
required-features = ["sharding"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
