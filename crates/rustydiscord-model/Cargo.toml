[package]
name = "rustydiscord-model"
description = "Discord API v10 types: users, guilds, channels, messages, interactions and gateway events"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/usslmuk/rustydiscord/tree/main/crates/rustydiscord-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bitflags.workspace = true
bytes.workspace = true
compact_str = { workspace = true, features = ["std", "serde"] }
serde = { workspace = true, features = ["std", "derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time.workspace = true

[dev-dependencies]
divan.workspace = true
serde_json.workspace = true

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "decode_bytes"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "interaction"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

